<!DOCTYPE html>
<!-- Offline downloads library (fork feature). Self-contained and precached by
     /sw.js so it works with no network. Plays videos stored in IndexedDB by
     /js/offline.js, skipping their saved SponsorBlock segments. Asset URLs are
     unversioned on purpose: the service worker rotates its cache per deploy. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Downloads — Invidious</title>
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#575757">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Invidious">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/offline.css">
</head>
<body class="downloads-page">
    <header class="downloads-header">
        <a href="/" class="downloads-home">Invidious</a>
        <h1>Downloads</h1>
        <span id="downloads-usage" class="downloads-usage"></span>
    </header>

    <main class="downloads-main">
        <div id="downloads-player" class="downloads-player" style="display:none"></div>

        <p id="downloads-empty" class="downloads-empty" style="display:none">
            No offline videos yet. Open a video and choose <b>Download</b> to save it here.
        </p>

        <div id="downloads-list" class="downloads-list"></div>
    </main>

    <script src="/js/offline.js"></script>
    <script src="/js/offline_library.js"></script>
</body>
</html>
