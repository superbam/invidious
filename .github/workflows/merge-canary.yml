# shorts-filter: early-warning that upstream iv-org/invidious still merges
# cleanly into this fork. Writes the result to the job summary and fails the
# job on conflict, so a broken merge shows up as a red run in Actions.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch on
# GitHub. For the weekly cron to fire, set `shorts-filter` as this fork's default
# branch (Settings > Branches), or run this manually via "Run workflow".
# See MAINTAINING.md.
name: Upstream merge canary

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shorts-filter
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "merge-canary"
          git config user.email "merge-canary@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/iv-org/invidious.git
          git fetch --no-tags upstream master

      - name: Attempt merge
        id: merge
        run: |
          if git merge --no-commit --no-ff upstream/master; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 1
          fi

      - name: Write summary
        if: always()
        run: |
          if [ "${{ steps.merge.outputs.result }}" = "clean" ]; then
            {
              echo "### ✅ Upstream merge canary"
              echo "\`upstream/master\` merges cleanly into \`shorts-filter\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Upstream merge canary: conflict"
              echo "\`upstream/master\` no longer merges cleanly into \`shorts-filter\`."
              echo ""
              echo "**Conflicting files:**"
              echo '```'
              echo "${{ steps.merge.outputs.conflicts }}"
              echo '```'
              echo ""
              echo "Resolve by merging upstream locally — see MAINTAINING.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
