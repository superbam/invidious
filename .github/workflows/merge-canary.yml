# shorts-filter: early-warning that upstream iv-org/invidious still merges
# cleanly into this fork. Opens (or comments on) a tracking issue when it stops.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch on
# GitHub. For the weekly cron to fire, set `shorts-filter` as this fork's default
# branch (Settings > Branches), or run this manually via "Run workflow".
# See MAINTAINING.md.
name: Upstream merge canary

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: shorts-filter
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "merge-canary"
          git config user.email "merge-canary@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/iv-org/invidious.git
          git fetch --no-tags upstream master

      - name: Attempt merge
        id: merge
        run: |
          if git merge --no-commit --no-ff upstream/master; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "✅ upstream/master merges cleanly into shorts-filter"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      - name: Report conflict
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const conflicts = `${{ steps.merge.outputs.conflicts }}`;
            const body = [
              "The scheduled merge canary found that `upstream/master` no longer",
              "merges cleanly into `shorts-filter`.",
              "",
              "**Conflicting files:**",
              "```",
              conflicts,
              "```",
              "",
              "Resolve by merging upstream locally — see MAINTAINING.md.",
            ].join("\n");
            const title = "⚠️ upstream no longer merges cleanly";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "merge-canary",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["merge-canary"],
              });
            }
